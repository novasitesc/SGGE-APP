# Backup diario de Postgres (Supabase) vía pg_dump.
# Guarda el dump como artifact de Actions (retención 30 días).
#
# Secrets requeridos (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  — URI :5432 (directa o Session pooler). NO uses :6543.
#
# Ejecución:
#   - Cron diario 06:00 UTC
#   - Manual: Actions → "Database backup" → Run workflow

name: Database backup

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "Formato del dump"
        required: true
        default: custom
        type: choice
        options:
          - custom
          - sql

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Si alguien pegó la línea de .env, recorta el prefijo antes de validar.
          SUPABASE_DB_URL="${SUPABASE_DB_URL#SUPABASE_DB_URL=}"
          SUPABASE_DB_URL="${SUPABASE_DB_URL#export }"
          export SUPABASE_DB_URL
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error title=Falta SUPABASE_DB_URL::Crea el secret en Settings → Secrets and variables → Actions. El valor debe ser solo postgresql://... (:5432), no el nombre de la variable ni el pooler :6543."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error title=SUPABASE_DB_URL inválida::El valor debe empezar por postgresql:// (sin SUPABASE_DB_URL=). Ese prefijo provoca: invalid connection option \"SUPABASE_DB_URL\"."
              exit 1
              ;;
          esac
          FORMAT="${{ github.event.inputs.format || 'custom' }}"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          sed -i 's/\r$//' scripts/backup-db.sh
          bash scripts/backup-db.sh --format "$FORMAT" --out-dir backups --keep 0
          ls -lh backups/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sgge-db-backup-${{ github.run_id }}
          path: backups/sgge-*
          if-no-files-found: error
          retention-days: 30
